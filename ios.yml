name: Build CogniCode IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The artifact name used to be hardcoded and drifted two builds behind, so the
      # downloaded IPA was labelled with the wrong build. Read it from release.json.
      - name: Read release identity
        id: release
        run: |
          echo "version=$(node -p 'require("./release.json").version')" >> "$GITHUB_OUTPUT"
          echo "build=$(node -p 'require("./release.json").build')" >> "$GITHUB_OUTPUT"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Verify device JavaScript
        run: |
          node tools/check-device-script.cjs
          node tools/check-change-set.cjs
          node --check app.js
          node --check workspace-store.js
          node --check workspace-features.js
          node --check change-set.js

      # The checkers launch with channel 'chrome' (the runner image ships Google
      # Chrome), so the bundled-browser download is skipped on purpose.
      - name: Install Playwright
        run: npm install --no-save playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # The shipped app is WKWebView, but every browser check above launches
      # Chromium. check-quick-start.cjs runs the editor-panel contract in both
      # engines, so a WebKit-only rendering difference cannot reach the device
      # unnoticed again. The checker skips WebKit gracefully if it is missing.
      - name: Install WebKit for the engine-parity check
        run: npx playwright install webkit

      # Must run before the browser checks: they exercise native/Web/index.html too,
      # so a stale bundle would be tested instead of the sources just edited.
      - name: Sync Web files to native
        run: pwsh -NoProfile -File tools/sync-native.ps1

      - name: Run browser checks
        env:
          BROWSER_CHANNEL: chrome
        run: |
          node tools/check-malwatch.cjs
          node tools/check-report-rendering.cjs
          node tools/check-ai-report.cjs
          node tools/check-code-import.cjs
          node tools/check-workspace.cjs
          node tools/check-analysis-terminal.cjs
          node tools/check-star-burst.cjs
          node tools/check-native-activity.cjs
          node tools/check-layout.cjs
          node tools/check-editor-sync.cjs
          node tools/check-ui-refinements.cjs
          node tools/check-orbital-header.cjs
          node tools/check-persian-font.cjs
          node tools/check-glass.cjs
          node tools/check-gradient.cjs
          node tools/check-gallery-particles.cjs
          node tools/check-launch.cjs
          node tools/check-quick-start.cjs

      - name: Verify release resources and version
        run: node tools/verify-release.cjs --manifest

      - name: Generate Xcode project
        working-directory: native
        run: |
          cp CogniCode/Info.plist /tmp/cognicode-source-info.plist
          xcodegen generate
          cmp CogniCode/Info.plist /tmp/cognicode-source-info.plist
          python3 ../tools/verify-ios-bundle.py

      - name: Verify generated bundle identifiers
        working-directory: native
        run: |
          xcodebuild -project CogniCode.xcodeproj \
            -alltargets -configuration Release -sdk iphoneos \
            -showBuildSettings -json > "$RUNNER_TEMP/cognicode-build-settings.json"
          python3 ../tools/verify-ios-bundle.py --build-settings "$RUNNER_TEMP/cognicode-build-settings.json"

      - name: Build App (unsigned)
        working-directory: native
        run: |
          xcodebuild -project CogniCode.xcodeproj \
            -scheme CogniCode \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            clean build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Verify full-screen launch config
        working-directory: native
        run: |
          python3 ../tools/verify-ios-bundle.py build/Build/Products/Release-iphoneos/CogniCode.app

      - name: Package IPA
        working-directory: native
        run: |
          rm -rf Payload CogniCode-unsigned.ipa
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -qry CogniCode-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CogniCode-${{ steps.release.outputs.version }}-build-${{ steps.release.outputs.build }}-${{ github.run_number }}
          path: |
            native/CogniCode-unsigned.ipa
            release.json
            release-manifest.json
          if-no-files-found: error
